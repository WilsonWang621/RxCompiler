name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build compiler, semantic tests and IR regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl python3 g++-14

      - name: Build compiler
        id: build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ci
          make build 2>&1 | tee target/ci/build.log

      - name: Run semantic tests
        id: semantic
        shell: bash
        run: |
          set -o pipefail
          # Reuse the compiler built above; the runner creates an empty runtime.
          make test STAGE=semantic VERBOSE=true BUILD= 2>&1 | tee target/ci/semantic.log

      - name: Install Clang 22
        run: |
          curl --fail --location https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 22

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'

      - name: Build REIMU
        id: reimu
        shell: bash
        run: |
          set -o pipefail
          xmake f -y -P vendor/REIMU -m release -o target/reimu --cc=gcc-14 --cxx=g++-14 2>&1 | tee target/ci/reimu-configure.log
          xmake -y -P vendor/REIMU 2>&1 | tee target/ci/reimu-build.log

      - name: Run IR smoke tests
        id: ir
        shell: bash
        run: |
          set -o pipefail
          make test STAGE=ir FILTER=official:codegen:builtin-io VERBOSE=true BUILD= 2>&1 | tee target/ci/ir.log

      - name: Run IR control-flow regressions
        id: control_flow
        shell: bash
        run: |
          set -o pipefail
          make test-ir-control-flow VERBOSE=true BUILD= 2>&1 | tee target/ci/control-flow.log

      - name: Write CI summary
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
          REIMU_OUTCOME: ${{ steps.reimu.outcome }}
          IR_OUTCOME: ${{ steps.ir.outcome }}
          CONTROL_FLOW_OUTCOME: ${{ steps.control_flow.outcome }}
        run: |
          {
            echo '## Rx compiler CI record'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: [${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            printf '| Compiler build | `%s` |\n' "${BUILD_OUTCOME}"
            printf '| Semantic tests | `%s` |\n' "${SEMANTIC_OUTCOME}"
            printf '| REIMU build | `%s` |\n' "${REIMU_OUTCOME}"
            printf '| IR smoke tests | `%s` |\n' "${IR_OUTCOME}"
            printf '| IR control-flow regressions | `%s` |\n' "${CONTROL_FLOW_OUTCOME}"
            if [ -f target/ci/semantic.log ]; then
              echo
              echo '```text'
              tail -n 3 target/ci/semantic.log
              echo '```'
            fi
            if [ -f target/ci/ir.log ]; then
              echo
              echo '```text'
              tail -n 3 target/ci/ir.log
              echo '```'
            fi
            if [ -f target/ci/control-flow.log ]; then
              echo
              echo '```text'
              tail -n 3 target/ci/control-flow.log
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload CI records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci/
            target/tests/
            target/build/CMakeCache.txt
            target/build/CMakeFiles/CMakeOutput.log
            target/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 90

      - name: Upload compiler
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ github.sha }}
          path: target/compiler
          if-no-files-found: error
          retention-days: 30
